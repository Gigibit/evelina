<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risultati estrazione</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1>Risultati dell'estrazione</h1>
      <p>Ecco i dati strutturati ottenuti dal documento caricato.</p>
    </header>

    <a href="{{ url_for('index') }}" class="back">&larr; Torna al caricamento</a>

    <section class="card">
      <h2>JSON estratto</h2>
      <pre>{{ data | tojson(indent=2, ensure_ascii=False) }}</pre>
    </section>

    <section class="card">
      <h2>Prompt utilizzato</h2>
      <pre>{{ prompt }}</pre>
    </section>
  </main>
</body>
</html>
